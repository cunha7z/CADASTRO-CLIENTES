<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body class="pagina-cadastro">
    <nav class="menu-navegacao">
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="clientes.html">Clientes</a>
    </nav>
    
    <main class="conteudo-principal">
        <img src="/assets/logo.png" alt="Logo da Empresa" class="logo">

        <form id="formulario-cadastro">
            <input type="text" id="nome" " placeholder="Ex.: Pedro" required>
            <input type="email" id="email"  placeholder="Ex.: pedro@email.com" required>
            <input type="text" id="telefone"  placeholder="Ex.: (71) 99999-9999" required>
            <button type="button" onclick="funcaoCadastrarCliente()">Cadastrar</button>
        </form>

    </main>

    <script src="cadastro.js"></script>
</body>
</html>
